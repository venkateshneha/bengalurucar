<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login | Bengaluru Car Rentals</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif; background: #0f1115;
  }
  .card {
    background: #171a21; border: 1px solid #262b36; border-radius: 12px;
    padding: 40px 36px; width: 100%; max-width: 360px;
  }
  .card h1 { color: #f4c542; font-size: 1.4rem; margin: 0 0 4px; }
  .card p { color: #9aa1ac; font-size: 0.85rem; margin: 0 0 24px; }
  label { display: block; color: #cfd3da; font-size: 0.85rem; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; margin-bottom: 16px; border-radius: 8px;
    border: 1px solid #2c313c; background: #10131a; color: #fff; font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: #f4c542; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px; background: #f4c542;
    color: #10131a; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 8px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .err { color: #f87171; font-size: 0.85rem; margin-top: 14px; min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <p>Bengaluru Car Rentals — booking dashboard</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button type="submit" id="loginBtn">Log In</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = 'admin-dashboard.html';
        } else {
          errEl.textContent = data.error || 'Login failed.';
        }
      } catch (err) {
        errEl.textContent = 'Something went wrong. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
